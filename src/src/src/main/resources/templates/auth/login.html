<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Đăng nhập')}"></head>
<body class="auth-compact-page">
<main class="auth-compact-scene">
  <section class="auth-compact-card auth-login-card">
    <a class="auth-compact-close" th:href="@{/}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
    <h2 class="auth-compact-brand"><span>Talent</span>Match</h2>
    <h1>Chào mừng trở lại</h1>
    <p class="auth-compact-intro">Đăng nhập để tiếp tục khám phá các dự án<br>và cơ hội trên TalentMatch.</p>
    <div th:replace="~{fragments/common :: flash}"></div>
    <nav class="auth-compact-tabs"><a class="active" th:href="@{/login}">Đăng nhập</a><a th:href="@{/register}">Đăng ký</a></nav>
    <form method="post" th:action="@{/login}" class="auth-compact-form">
      <label><strong>Email <em>*</em></strong><span class="auth-compact-input"><i class="fa-regular fa-envelope"></i><input type="email" name="email" placeholder="Nhập email của bạn" required autofocus></span></label>
      <label><strong>Mật khẩu <em>*</em></strong><span class="auth-compact-input"><i class="fa-solid fa-lock"></i><input id="auth-login-pass" type="password" name="password" placeholder="Nhập mật khẩu" required><button type="button" data-password-toggle="auth-login-pass" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye-slash"></i></button></span></label>
      <div class="auth-compact-line"><label><input type="checkbox" name="remember-me" checked> Ghi nhớ đăng nhập</label><a th:href="@{/forgot-password}">Quên mật khẩu?</a></div>
      <p class="auth-error" th:if="${param.error}">Email hoặc mật khẩu sai, hoặc tài khoản chưa xác minh.</p>
      <button class="auth-compact-primary" type="submit">Đăng nhập <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <div class="auth-compact-or"><span>Hoặc</span></div>
    <p class="auth-compact-bottom">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a></p>
  </section>
</main>
<script th:replace="~{fragments/common :: scripts}"></script>
</body>
</html>
