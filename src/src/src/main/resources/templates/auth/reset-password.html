<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Đặt lại mật khẩu')}"></head>
<body class="auth-compact-page"><main class="auth-compact-scene"><section class="auth-compact-card auth-forgot-card">
<a class="auth-compact-close" th:href="@{/}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
<h2 class="auth-compact-brand"><span>Talent</span>Match</h2><h1>Đặt lại mật khẩu</h1>
<p class="auth-compact-intro">Nhập OTP 6 số gửi đến email và mật khẩu mới. OTP có hiệu lực 5 phút.</p>
<div th:replace="~{fragments/common :: flash}"></div>
<form th:action="@{/reset-password}" method="post" class="auth-compact-form">
<input type="hidden" name="email" th:value="${email}">
<label><strong>OTP <em>*</em></strong><span class="auth-compact-input"><i class="fa-solid fa-key"></i><input type="text" name="otp" pattern="[0-9]{6}" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required placeholder="Nhập OTP gồm 6 số"></span></label>
<label><strong>Mật khẩu mới <em>*</em></strong><span class="auth-compact-input"><i class="fa-solid fa-lock"></i><input type="password" name="password" minlength="8" required placeholder="Nhập mật khẩu mới"></span></label>
<label><strong>Xác nhận mật khẩu <em>*</em></strong><span class="auth-compact-input"><i class="fa-solid fa-lock"></i><input type="password" name="confirmPassword" minlength="8" required placeholder="Nhập lại mật khẩu"></span></label>
<button class="auth-compact-primary" type="submit">Đổi mật khẩu <i class="fa-solid fa-arrow-right"></i></button></form>
<p class="auth-compact-bottom"><a th:href="@{/forgot-password}">Yêu cầu mã mới</a></p>
</section></main><script th:replace="~{fragments/common :: scripts}"></script></body></html>
