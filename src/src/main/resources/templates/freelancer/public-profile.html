<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Hồ sơ Freelancer')}"></head><body><header th:replace="~{fragments/common :: topbar}"></header>
<section class="profile-public-hero"><div class="container profile-public-card"><span class="avatar avatar-profile" th:text="${#strings.substring(profile.fullName,0,1)}">F</span><div class="grow"><span class="verified">✓ Hồ sơ đã xác minh</span><h1 th:text="${profile.fullName}">Freelancer</h1><p th:text="${profile.professionalTitle}"></p><div class="chips"><span class="chip" th:each="s:${#strings.arraySplit(profile.skills != null ? profile.skills : '', ',')}" th:text="${#strings.trim(s)}"></span></div></div><div class="profile-rate"><b th:text="${profile.hourlyRate != null ? #numbers.formatDecimal(profile.hourlyRate,0,'POINT',0,'COMMA') + 'đ/giờ' : 'Thỏa thuận'}"></b><span>★ <span th:text="${profile.rating}"></span></span></div></div></section>
<section class="page-section"><div class="container profile-layout"><main class="stack"><article class="card card-pad"><h2>Giới thiệu</h2><p class="text-body" th:text="${profile.bio != null ? profile.bio : 'Freelancer chưa cập nhật phần giới thiệu.'}"></p></article><article class="card card-pad"><h2>Năng lực chuyên môn</h2><div class="info-grid"><div><small>Lĩnh vực</small><b th:text="${profile.field != null ? profile.field : 'Chưa cập nhật'}"></b></div><div><small>Kinh nghiệm</small><b th:text="${profile.experienceYears + ' năm'}"></b></div><div><small>Địa điểm</small><b th:text="${profile.location != null ? profile.location : 'Việt Nam'}"></b></div><div><small>Trạng thái</small><b th:text="${profile.available ? 'Sẵn sàng nhận việc' : 'Đang bận'}"></b></div></div></article></main><aside class="card card-pad sticky"><h3>Thông tin hồ sơ</h3><div class="profile-metric"><span>Dự án hoàn thành</span><b th:text="${profile.completedProjects}"></b></div><div class="profile-metric"><span>Rating</span><b th:text="${profile.rating}"></b></div><div class="profile-metric"><span>Website</span><a th:if="${profile.website != null and !#strings.isEmpty(profile.website)}" th:href="${profile.website}" target="_blank">Xem portfolio ↗</a><span th:unless="${profile.website != null and !#strings.isEmpty(profile.website)}">Chưa cập nhật</span></div></aside></div></section><footer th:replace="~{fragments/common :: footer}"></footer><script th:replace="~{fragments/common :: scripts}"></script></body></html>
