<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Thông báo')}"></head><body class="app-body"><aside th:replace="~{fragments/common :: sidebar}"></aside><div th:replace="~{fragments/common :: mobileAppbar('Thông báo')}"></div><div class="app-main"><header th:replace="~{fragments/common :: appTop('Thông báo của tôi')}"></header><main class="app-content"><section class="v31-panel"><h1><i class="fa-regular fa-bell"></i> Trung tâm thông báo</h1><p class="muted">Các cập nhật về đề xuất, hợp đồng, thanh toán, bàn giao và tranh chấp của bạn.</p><div class="v31-notification" th:each="n:${notifications}" th:classappend="${!n.read} ? ' unread' : ''"><div><b th:text="${n.title}">Tiêu đề</b><p th:text="${n.message}">Nội dung</p><small th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></small></div><form th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="v31-primary">Xem chi tiết <i class="fa-solid fa-arrow-right"></i></button></form></div><p th:if="${#lists.isEmpty(notifications)}">Chưa có thông báo nào.</p></section></main></div><script th:replace="~{fragments/common :: scripts}"></script></body></html>
