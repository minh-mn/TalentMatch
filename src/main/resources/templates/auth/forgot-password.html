<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Quên mật khẩu')}"></head>
<body class="forgot-pattern-body">
<div th:replace="~{fragments/common :: flash}"></div>
<main class="forgot-center-wrap">
  <section class="forgot-card">
    <a class="market-auth-close forgot-close" th:href="@{/}" aria-label="Đóng quên mật khẩu"><i class="fa-solid fa-xmark"></i></a>
    <a class="forgot-logo" th:href="@{/}"><span>Talent</span>Match</a>
    <p class="forgot-intro">Vui lòng nhập email của bạn để đặt lại mật khẩu<br>tài khoản</p>

    <form th:action="@{/forgot-password}" method="post" class="forgot-form">
      <label>
        <span class="market-field-label">Email <em>*</em></span>
        <input type="email" name="email" required autofocus placeholder="Nhập email">
      </label>
      <button type="submit">Gửi liên kết khôi phục mật khẩu <i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <p class="forgot-bottom">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
  </section>
</main>
<script th:replace="~{fragments/common :: scripts}"></script>
</body>
</html>
