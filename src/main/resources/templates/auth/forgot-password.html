<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Quên mật khẩu')}"></head>
<body class="auth-compact-page">
<main class="auth-compact-scene">
  <section class="auth-compact-card auth-forgot-card">
    <a class="auth-compact-close" th:href="@{/}" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></a>
    <h2 class="auth-compact-brand"><span>Talent</span>Match</h2>
    <h1>Quên mật khẩu?</h1>
    <p class="auth-compact-intro">Vui lòng nhập email của bạn để đặt lại mật khẩu<br>tài khoản.</p>
    <div th:replace="~{fragments/common :: flash}"></div>
    <form method="post" th:action="@{/forgot-password}" class="auth-compact-form">
      <label><strong>Email <em>*</em></strong><span class="auth-compact-input"><i class="fa-regular fa-envelope"></i><input type="email" name="email" placeholder="Nhập email của bạn" required autofocus></span></label>
      <button class="auth-compact-primary" type="submit">Gửi mã OTP khôi phục mật khẩu <i class="fa-solid fa-arrow-right"></i></button>
      <p class="auth-compact-hint">OTP 6 số gửi đến email đã xác minh, hiệu lực 5 phút.</p>
    </form>
    <div class="auth-compact-or"><span>Hoặc</span></div>
    <p class="auth-compact-bottom"><a th:href="@{/login}"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a></p>
  </section>
</main>
<script th:replace="~{fragments/common :: scripts}"></script>
</body>
</html>
