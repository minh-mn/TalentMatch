<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Đặt lại mật khẩu')}"></head>
<body class="forgot-pattern-body">
<div th:replace="~{fragments/common :: flash}"></div>
<main class="forgot-center-wrap">
  <section class="forgot-card forgot-reset-card">
    <a class="market-auth-close forgot-close" th:href="@{/}" aria-label="Đóng đặt lại mật khẩu"><i class="fa-solid fa-xmark"></i></a>
    <a class="forgot-logo" th:href="@{/}"><span>Talent</span>Match</a>
    <p class="forgot-intro">Tạo mật khẩu mới cho tài khoản của bạn</p>
    <form th:action="@{/reset-password}" method="post" class="forgot-form">
      <input type="hidden" name="token" th:value="${token}">
      <label><span class="market-field-label">Mật khẩu mới <em>*</em></span><input type="password" name="password" minlength="8" required placeholder="Nhập mật khẩu mới"></label>
      <label><span class="market-field-label">Xác nhận mật khẩu <em>*</em></span><input type="password" name="confirmPassword" minlength="8" required placeholder="Nhập lại mật khẩu"></label>
      <button type="submit">Cập nhật mật khẩu <i class="fa-solid fa-arrow-right"></i></button>
    </form>
    <p class="forgot-bottom"><a th:href="@{/login}">← Quay lại đăng nhập</a></p>
  </section>
</main>
<script th:replace="~{fragments/common :: scripts}"></script>
</body>
</html>
