<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Lời mời đã gửi')}"></head>
<body class="market-body client-workspace client-v52-page"><aside th:replace="~{fragments/common :: marketSidebar('invitations')}"></aside><header th:replace="~{fragments/common :: marketClientTopbar()}"></header><div th:replace="~{fragments/common :: flash}"></div><main class="market-main client-main"><div class="client-shell"><div class="client-breadcrumb">Workspace / Lời mời</div><div class="client-page-heading"><div><span class="client-eyebrow">KẾT NỐI NHÂN SỰ</span><h1>Lời mời <span>đã gửi</span></h1><p>Quản lý lời mời từ các công việc; Freelancer có thể đồng ý và chuyển sang gửi Proposal.</p></div><a class="client-btn primary" th:href="@{/customer/talent}">+ Mời thêm Freelancer</a></div>
    <section class="client-panel client-table-panel"><table class="client-table"><thead><tr><th>Freelancer</th><th>Dự án</th><th>Thời gian</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr th:each="i:${invitations}"><td><b th:text="${i.freelancer.fullName}">F</b><small th:text="${i.freelancer.professionalTitle}">Chuyên môn</small></td><td th:text="${i.job.title}">Công việc</td><td th:text="${#temporals.format(i.createdAt,'dd/MM/yyyy HH:mm')}">Ngày</td><td><span class="client-badge" th:text="${i.status}">SENT</span></td><td><a th:href="@{/freelancers/{id}(id=${i.freelancer.id})}">Hồ sơ ↗</a></td></tr></tbody></table><div class="client-empty" th:if="${#lists.isEmpty(invitations)}">Chưa gửi lời mời nào. <a th:href="@{/customer/talent}">Khám phá Freelancer →</a></div></section>
</div></main><script th:replace="~{fragments/common :: scripts}"></script></body></html>
