<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Tất cả đề xuất')}"></head>
<body class="market-body client-workspace"><aside th:replace="~{fragments/common :: marketSidebar('applicants')}"></aside><header th:replace="~{fragments/common :: marketTopbar('hire')}"></header><div th:replace="~{fragments/common :: flash}"></div><main class="market-main client-main"><div class="client-shell"><div class="client-breadcrumb">Workspace / Ứng viên</div><div class="client-page-heading"><div><span class="client-eyebrow">TUYỂN CHỌN</span><h1>Quản lý <span>ứng viên</span></h1><p>Toàn bộ Proposal nhận được từ các tin đăng của doanh nghiệp.</p></div><a class="client-btn primary" th:href="@{/customer/talent}">Tìm & mời Freelancer</a></div>
<div class="client-cards"><article class="client-job-card" th:each="a:${applications}"><div class="client-job-leading"><span class="client-avatar" th:text="${#strings.substring(a.freelancer.fullName,0,1)}">F</span><div><span class="client-tag" th:text="${a.job.category}">Lĩnh vực</span><h2 th:text="${a.freelancer.fullName}">Freelancer</h2><p><b th:text="${a.job.title}">Tên công việc</b></p><p th:text="${#strings.abbreviate(a.proposal,170)}">Proposal</p><div class="client-job-tags"><span th:text="${a.estimatedDays}+' ngày'">Ngày</span><span th:text="${a.status}">Trạng thái</span></div></div></div><div class="client-job-right"><strong th:text="${#numbers.formatDecimal(a.proposedPrice,0,'POINT',0,'COMMA')}+'₫'">0đ</strong><a class="client-btn outline" th:href="@{/customer/jobs/{id}/applicants(id=${a.job.id})}">Xử lý Proposal →</a><a class="client-mini-link" th:href="@{/freelancers/{id}(id=${a.freelancer.id})}">Xem hồ sơ →</a></div></article></div><div class="client-empty" th:if="${#lists.isEmpty(applications)}">Chưa có đề xuất. <a th:href="@{/customer/jobs/new}">Đăng công việc đầu tiên</a>.</div>
</div></main><script th:replace="~{fragments/common :: scripts}"></script></body></html>
