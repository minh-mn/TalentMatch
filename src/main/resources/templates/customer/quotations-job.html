<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Báo giá &amp; Thương lượng')}"></head><body class="market-body client-workspace tm122 tm123 tm124 tm125"><link rel="stylesheet" th:href="@{/css/customer-footer-banner-v72.css(v=72)}"/><link rel="stylesheet" th:href="@{/css/customer-posted-v94.css(v=94)}"/><link rel="stylesheet" th:href="@{/css/client-sidebar-v118.css}"/><link rel="stylesheet" th:href="@{/css/client-sidebar-v119.css}"/><link rel="stylesheet" th:href="@{/css/client-quotes-v122.css(v=122)}"/><link rel="stylesheet" th:href="@{/css/client-quotes-v123.css(v=123)}"/><link rel="stylesheet" th:href="@{/css/client-quotes-v124.css(v=124)}"/><link rel="stylesheet" th:href="@{/css/client-quotes-v125.css(v=125)}"/><aside th:replace="~{fragments/common :: marketSidebar('quotes')}"></aside><header th:replace="~{fragments/common :: marketClientTopbar()}"></header><div th:replace="~{fragments/common :: flash}"></div><main class="market-main client-main tm122-main"><div class="tm122-wrap"><section class="tm124-hero"><img alt="Trao đổi báo giá" th:src="@{/images/tm-client-exchange-v124.png}"/></section><a class="tm122-back" th:href="@{/customer/quotations}">← Trở về danh sách dự án</a><div class="tm122-panel tm122-jobsummary"><h1 th:text="${job.title}">Tên công việc</h1><p>Ngân sách: <b class="tm122-money" th:text="${job.budget!=null ? #numbers.formatDecimal(job.budget,0,'POINT',0,'COMMA')+'đ' : 'Thỏa thuận'}"></b> · <span th:text="${#lists.size(candidates)}+' ứng tuyển'"></span> · <span th:text="${replyCount}+' cần phản hồi'"></span></p></div><div class="tm122-two"><section class="tm122-panel"><div class="tm122-panelheading"><h2>Freelancer đã gửi báo giá</h2><form method="get"><select name="sort" onchange="this.form.submit()"><option th:selected="${sort=='newest'}" value="newest">Mới nhất</option><option th:selected="${sort=='priceLow'}" value="priceLow">Giá thấp nhất</option><option th:selected="${sort=='priceHigh'}" value="priceHigh">Giá cao nhất</option><option th:selected="${sort=='days'}" value="days">Thời gian ngắn nhất</option></select></form></div><div class="tm122-empty" th:if="${#lists.isEmpty(candidates)}">Dự án chưa có ứng tuyển nào.</div><a class="tm122-candidate" th:each="a:${candidates}" th:href="@{/customer/quotations/jobs/{j}/applications/{a}(j=${job.id},a=${a.id})}" title="Xem chi tiết báo giá và lịch sử thương lượng"><div class="tm122-avatar" th:text="${#strings.substring(a.freelancer.fullName,0,1)}">F</div><div class="tm122-candtext"><h3 th:text="${a.freelancer.fullName}">Freelancer</h3><small th:text="${latestById[a.id]!=null ? 'Phiên bản v'+latestById[a.id].version : 'Ứng tuyển chưa có v1'}"></small><p th:text="${#strings.abbreviate(latestById[a.id]!=null ? latestById[a.id].scope : a.proposal,110)}"></p></div><div class="tm122-candright"><b class="tm122-money" th:text="${#numbers.formatDecimal(latestById[a.id]!=null ? latestById[a.id].amount : a.proposedPrice,0,'POINT',0,'COMMA')+'đ'}"></b><small th:text="${(latestById[a.id]!=null ? latestById[a.id].estimatedDays : a.estimatedDays)+' ngày'}"></small><span class="tm122-state" th:text="${latestById[a.id]==null?'Chưa có v1':(latestById[a.id].status.name()=='ACCEPTED'?'Đã chốt':(latestById[a.id].status.name()=='PENDING'?(latestById[a.id].author.id==viewer.id?'Chờ Freelancer':'Chờ Client'):'Đã phản hồi'))}"></span></div></a></section><aside class="tm122-panel"><h2>So sánh nhanh</h2><div class="tm122-comparison"><span>Giá thấp nhất</span><strong class="tm122-money" th:text="${minPrice!=null ? #numbers.formatDecimal(minPrice,0,'POINT',0,'COMMA')+'đ' : '—'}"></strong><span>Thời gian ngắn nhất</span><strong th:text="${minDays&gt;0 ? minDays+' ngày' : '—'}"></strong><span>Cần Client phản hồi</span><strong th:text="${replyCount}"></strong></div><div class="tm122-hint">Chọn một Freelancer để xem phạm vi thực hiện, lịch sử phiên bản và quyết định phản hồi.</div></aside></div></div><footer th:replace="~{fragments/common :: clientFooter}"></footer></main><script th:replace="~{fragments/common :: scripts}"></script><link rel="stylesheet" th:href="@{/css/client-sidebar-footer-v170.css(v=170)}">
<link rel="stylesheet" th:href="@{/css/client-unified-v172.css(v=172)}">
</body></html>
