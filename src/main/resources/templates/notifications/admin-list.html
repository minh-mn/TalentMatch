<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/common :: head('Thông báo')}"></head><link rel="stylesheet" th:href="@{/css/admin-trust-system-v164.css(v=164)}"><body class="market-body client-workspace admin-workspace admin-unified"><aside th:replace="~{fragments/common :: marketSidebar('notifications')}"></aside><header th:replace="~{fragments/common :: marketTopbar('admin')}"></header><div th:replace="~{fragments/common :: flash}"></div><main class="market-main client-main admin-main"><div class="client-shell admin-shell tm155-shell"><section class="tm155-hero"><div><span class="tm155-eyebrow">TÀI KHOẢN</span><h1>Trung tâm thông báo</h1><p>Thông báo chỉ hiển thị cho tài khoản đăng nhập; cập nhật đã đọc được lưu vào database.</p></div><i class="fa-regular fa-bell"></i></section><section class="tm155-panel"><div class="tm155-heading"><div><h2>Thông báo của tôi</h2><p><b th:text="${unreadCount}">0</b> thông báo chưa đọc</p></div><form th:action="@{/notifications/read-all}" method="post"><button class="tm155-button" th:disabled="${unreadCount==0}">Đánh dấu tất cả đã đọc</button></form></div><div class="tm155-links"><a th:href="@{/notifications(filter='all')}">Tất cả</a><a th:href="@{/notifications(filter='unread')}">Chưa đọc</a><a th:href="@{/notifications(filter='read')}">Đã đọc</a></div><div class="tm155-notice" th:each="n:${notifications}" th:classappend="${!n.read?' is-unread':''}"><div><div class="tm155-notice-title"><b th:text="${n.title}">Tiêu đề</b><span class="tm155-pill tm155-info" th:if="${!n.read}">Mới</span></div><p th:text="${n.message}"></p><small th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></small></div><form th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="tm155-button" th:text="${n.read?'Xem chi tiết':'Đọc và xem'}">Xem</button></form></div><p class="tm155-empty" th:if="${#lists.isEmpty(notifications)}">Không có thông báo phù hợp.</p></section></div></main><footer th:replace="~{fragments/common :: adminFooter}"></footer><script th:replace="~{fragments/common :: scripts}"></script></body></html>
