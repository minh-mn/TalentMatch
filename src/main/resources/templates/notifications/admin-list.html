<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Trung tâm thông báo')}"></head>
<body class="market-body client-workspace admin-workspace admin-unified tm184-notify tm184-admin">
<link rel="stylesheet" th:if="${currentUser.role.name()=='FREELANCER'}" th:href="@{/css/freelancer-dashboard-reference.css}">
<link rel="stylesheet" th:if="${currentUser.role.name()=='FREELANCER'}" th:href="@{/css/freelancer-layout-v106.css(v=106)}">
<aside th:replace="~{fragments/common :: marketSidebar('notifications')}"></aside>
<header th:replace="~{fragments/common :: marketTopbar('admin')}"></header>

<div th:replace="~{fragments/common :: flash}"></div>
<main class="market-main client-main admin-main tm184-main">
 <div class="tm184-container">
  <header class="tm184-hero"><div><span class="tm184-kicker">TÀI KHOẢN & CẬP NHẬT</span><h1>Trung tâm thông báo</h1><p>Nhận cập nhật về dự án, hợp đồng, tiến độ, thanh toán và tranh chấp của bạn.</p></div><span class="tm184-hero-icon"><i class="fa-regular fa-bell"></i></span></header>
  <section class="tm184-stats" aria-label="Thống kê thông báo"><div class="tm184-stat"><small>Tổng thông báo gần đây</small><strong th:text="${allCount}">0</strong></div><div class="tm184-stat"><small>Chưa đọc</small><strong class="tm184-blue" th:text="${unreadCount}">0</strong></div><div class="tm184-stat"><small>Đã đọc</small><strong th:text="${readCount}">0</strong></div></section>
  <section class="tm184-panel"><div class="tm184-toolbar"><nav aria-label="Bộ lọc thông báo"><a th:classappend="${filter=='all'}?' active':''" th:href="@{/notifications(filter='all')}">Tất cả</a><a th:classappend="${filter=='unread'}?' active':''" th:href="@{/notifications(filter='unread')}">Chưa đọc</a><a th:classappend="${filter=='read'}?' active':''" th:href="@{/notifications(filter='read')}">Đã đọc</a></nav><form method="post" th:action="@{/notifications/read-all}"><button class="tm184-mark" th:disabled="${unreadCount==0}"><i class="fa-solid fa-check-double"></i> Đánh dấu tất cả đã đọc</button></form></div>
   <div class="tm184-list"><article class="tm184-item" th:each="n:${notifications}" th:classappend="${!n.read}?' unread':''"><div class="tm184-status-icon"><i class="fa-regular fa-bell"></i></div><div class="tm184-item-body"><div class="tm184-item-head"><h2 th:text="${n.title}">Thông báo</h2><span class="tm184-new" th:if="${!n.read}">Chưa đọc</span></div><p th:text="${n.message}">Nội dung</p><time th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}">Thời gian</time></div><form method="post" th:action="@{/notifications/{id}/read(id=${n.id})}"><button class="tm184-view"><i class="fa-regular fa-eye"></i> <span th:text="${n.read}?'Xem chi tiết':'Đọc & xem'">Xem</span></button></form></article></div>
   <div class="tm184-empty" th:if="${#lists.isEmpty(notifications)}"><i class="fa-regular fa-bell-slash"></i><p>Không có thông báo phù hợp với bộ lọc.</p></div>
  </section>
 </div>
 <footer th:replace="~{fragments/common :: adminFooter}"></footer>
</main>
<script th:replace="~{fragments/common :: scripts}"></script>
</body></html>
