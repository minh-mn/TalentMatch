<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Câu hỏi công việc')}"></head>
<body class="market-body client-workspace"><aside th:replace="~{fragments/common :: marketSidebar('posted')}"></aside><header th:replace="~{fragments/common :: marketTopbar('hire')}"></header><div th:replace="~{fragments/common :: flash}"></div><main class="market-main client-main"><div class="client-shell"><div class="client-breadcrumb">Công việc / Hỏi đáp</div><div class="client-page-heading"><div><span class="client-eyebrow">TRAO ĐỔI TRƯỚC ỨNG TUYỂN</span><h1>Hỏi đáp <span>công việc</span></h1><p>Freelancer hỏi rõ yêu cầu; Client trả lời công khai, mọi người có thể theo dõi.</p></div></div>
<div class="client-panel client-job-summary"><h2><a th:href="@{/jobs/{id}(id=${job.id})}" th:text="${job.title}">Tên công việc</a></h2><p th:text="${job.description}">Mô tả</p></div>
<div class="client-panel client-question-box" th:if="${currentUser!=null and currentUser.role.name()=='FREELANCER' and job.status.name()=='OPEN'}"><h2>Đặt câu hỏi</h2><form method="post" th:action="@{/jobs/{id}/discussion(id=${job.id})}"><textarea name="text" minlength="8" required rows="3" placeholder="Cần làm rõ phạm vi, tài liệu, deadline...?"></textarea><button type="submit" class="client-btn primary">Gửi câu hỏi</button></form></div>
<div class="client-cards"><article class="client-panel client-question-box" th:each="q:${questions}"><small th:text="${q.author.fullName}+' · '+${#temporals.format(q.createdAt,'dd/MM/yyyy HH:mm')}">Freelancer</small><h2 th:text="${q.question}">Câu hỏi</h2><div class="client-answer" th:if="${q.answer!=null}"><b>Phản hồi từ Client</b><p th:text="${q.answer}">Câu trả lời</p></div><form method="post" th:if="${currentUser!=null and currentUser.id==job.customer.id and q.answer==null}" th:action="@{/customer/questions/{id}/answer(id=${q.id})}"><textarea name="text" required minlength="5" rows="2" placeholder="Trả lời câu hỏi..."></textarea><button class="client-btn primary">Gửi câu trả lời</button></form></article></div><div class="client-empty" th:if="${#lists.isEmpty(questions)}">Chưa có câu hỏi cho công việc này.</div>
</div></main><script th:replace="~{fragments/common :: scripts}"></script></body></html>
