<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Có lỗi xảy ra')}"></head>
<body class="market-body">
<main class="page-section">
    <div class="container">
        <section class="empty-card error-page" style="max-width:640px;margin:48px auto;text-align:center;padding:40px">
            <span aria-hidden="true">!</span>
            <h1>Chưa thể hoàn tất yêu cầu</h1>
            <p>Đã xảy ra lỗi trong hệ thống. Vui lòng thử lại sau hoặc liên hệ hỗ trợ.</p>
            <p>Mã lỗi: <strong th:text="${errorId}">—</strong></p>
            <a class="btn btn-gradient" href="javascript:history.back()">Quay lại</a>
            <a class="btn btn-gradient" th:href="@{/}">Về trang chủ</a>
        </section>
    </div>
</main>
</body>
</html>
