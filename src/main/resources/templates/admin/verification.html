<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Xác minh tài khoản')}"></head><body class="market-body client-workspace admin-workspace tm164-admin"><aside th:replace="~{fragments/common :: marketSidebar('verification')}"></aside><header th:replace="~{fragments/common :: marketTopbar('admin')}"></header><div th:replace="~{fragments/common :: flash}"></div><link rel="stylesheet" th:href="@{/css/admin-trust-system-v164.css(v=164)}"><main class="market-main client-main admin-main"><div class="client-shell admin-shell tm164-shell"><section th:replace="~{fragments/common :: rolePageBanner('KIỂM DUYỆT & HỖ TRỢ','Xác minh tài khoản','Đối chiếu trạng thái xác minh và tình trạng khóa của các tài khoản.','fa-solid fa-user-check')}" class="tm176-banner-slot"></section><section class="tm164-kpis"><article><small>Chưa kích hoạt</small><strong th:text="${pendingCount}">0</strong></article><article><small>Đã kích hoạt</small><strong th:text="${verifiedCount}">0</strong></article><article><small>Đang bị khóa</small><strong th:text="${lockedCount}">0</strong></article></section><section class="tm164-panel"><div class="tm164-heading"><h2>Danh sách tài khoản</h2><a class="tm164-btn-muted" th:href="@{/admin/users}">Quản lý người dùng</a></div><form class="tm164-filter" th:action="@{/admin/verification}"><input name="q" th:value="${q}" placeholder="Tìm theo họ tên hoặc email..."><select name="status"><option value="pending" th:selected="${status=='pending'}">Chưa kích hoạt</option><option value="verified" th:selected="${status=='verified'}">Đã kích hoạt</option><option value="all" th:selected="${status=='all'}">Tất cả</option></select><button>Lọc</button><a class="tm164-btn-muted" th:href="@{/admin/verification}">Đặt lại</a></form><div class="tm164-table-scroll"><table class="tm164-table"><thead><tr><th>Người dùng</th><th>Email</th><th>Vai trò</th><th>Trạng thái kích hoạt</th><th>Tài khoản</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u:${rows}"><td th:text="${u.fullName}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td><span class="tm164-status" th:classappend="${u.enabled?' done':' pending'}" th:text="${u.enabled?'Đã kích hoạt':'Chưa kích hoạt'}"></span></td><td><span class="tm164-status" th:classappend="${u.locked?' rejected':' done'}" th:text="${u.locked?'Đang khóa':'Bình thường'}"></span></td><td><a class="tm164-btn-muted" th:href="@{/admin/users(q=${u.email})}">Xem trong quản lý</a></td></tr></tbody></table></div><p class="tm164-empty" th:if="${#lists.isEmpty(rows)}">Không có tài khoản phù hợp.</p></section></div></main><footer th:replace="~{fragments/common :: adminFooter}"></footer><script th:replace="~{fragments/common :: scripts}"></script></body></html>
