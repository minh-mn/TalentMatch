spring.application.name=TalentMatch
server.port=8080

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/talentmatch_pro?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.web.locale=vi_VN
spring.web.locale-resolver=fixed

# Email th?t qua SMTP. V?i Gmail: dùng App Password, không dùng m?t kh?u Gmail th??ng.
# Có th? ghi ?è toàn b? b?ng Environment Variables khi ch?y IntelliJ/Eclipse.
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Seed d? li?u marketplace ?? trang tìm d? án có nhi?u d? li?u demo.
app.demo.seed=${APP_DEMO_SEED:false}
app.demo.matching.seed=${APP_DEMO_MATCHING_SEED:false}

# Ngày t? <input type="date"> luôn là ISO yyyy-MM-dd (tránh l?i bind do spring.web.locale=vi_VN)
spring.mvc.format.date=iso

# Cho phep gui tep chat toi da 10 MB (khong thay doi tep ban giao)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# V129: DEMO ledger settlement, 3 calendar days after Client acceptance
talentmatch.settlement.hold-days=3
talentmatch.settlement.check-ms=60000
talentmatch.wallet.demo-fee-percent=10

# VNPay Sandbox. Use the matching TMN code and hash secret from the same merchant profile.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}

# Gemini assistant (optional; only general questions with user opt-in)
app.chat.gemini.key=${GEMINI_API_KEY:}
app.chat.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# Groq assistant; API key must be supplied via environment variable.
app.chat.groq.key=${GROQ_API_KEY:}
app.chat.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
